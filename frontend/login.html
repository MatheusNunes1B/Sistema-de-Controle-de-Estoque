<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Estoque - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo/Título -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-indigo-600 mb-2">📦 Estoque</h1>
      <p class="text-gray-600">Sistema de Controle de Inventário</p>
    </div>

    <!-- Card de Login/Cadastro -->
    <div class="bg-white rounded-lg shadow-xl p-8">
      <!-- Tabs -->
      <div class="flex gap-4 mb-8 border-b border-gray-200">
        <button id="tab-login" class="flex-1 py-3 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600">
          Login
        </button>
        <button id="tab-cadastro" class="flex-1 py-3 text-center font-semibold text-gray-500 border-b-2 border-transparent hover:text-gray-700">
          Cadastro
        </button>
      </div>

      <!-- Formulário de Login -->
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input type="email" id="login-email" placeholder="seu@email.com" required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
          <input type="password" id="login-senha" placeholder="••••••••" required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition">
          Entrar
        </button>
        <div id="msg-login" class="text-sm text-red-600 hidden mt-2"></div>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="form-cadastro" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nome completo</label>
          <input type="text" id="cadastro-nome" placeholder="Seu nome" required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input type="email" id="cadastro-email" placeholder="seu@email.com" required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
          <input type="password" id="cadastro-senha" placeholder="••••••••" required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de acesso</label>
          <select id="cadastro-tipo" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="usuario">Usuário (apenas visualização)</option>
            <option value="funcionario">Funcionário (scanner + histórico)</option>
            <option value="admin">Administrador (acesso total)</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition">
          Criar conta
        </button>
        <div id="msg-cadastro" class="text-sm text-red-600 hidden mt-2"></div>
      </form>

      <!-- Link de demo -->
      <div class="mt-6 p-4 bg-blue-50 rounded-lg text-sm text-gray-600">
        <p class="font-semibold text-blue-900 mb-1">👤 Teste rápido:</p>
        <p>Email: <code class="bg-white px-2 py-1 rounded">admin@sistema.com</code></p>
        <p>Senha: <code class="bg-white px-2 py-1 rounded">admin123</code></p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
