<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos — Arquivo Morto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="layout-shell"></div>

<template id="tpl-content">
  <div class="max-w-6xl mx-auto">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <h2 class="text-2xl font-bold">Produtos</h2>
        <p class="text-sm text-gray-500">Cadastro de itens do arquivo morto / depósito</p>
      </div>
      <button id="btn-novo-produto" class="btn-amber">+ Novo Produto</button>
    </div>

    <div class="card p-4 mb-6 flex flex-wrap gap-3 items-end">
      <div class="flex-1 min-w-[180px]">
        <label class="text-xs text-gray-500 font-medium">Buscar por nome ou código</label>
        <input id="filtro-busca" placeholder="Ex: 001.001.0042 ou Caixa fiscal" class="border rounded-lg px-3 py-2 text-sm w-full">
      </div>
      <div>
        <label class="text-xs text-gray-500 font-medium">Família</label>
        <select id="filtro-familia" class="border rounded-lg px-3 py-2 text-sm bg-white"><option value="">Todas</option></select>
      </div>
      <div>
        <label class="text-xs text-gray-500 font-medium">Tipo</label>
        <select id="filtro-tipo" class="border rounded-lg px-3 py-2 text-sm bg-white"><option value="">Todos</option></select>
      </div>
      <label class="flex items-center gap-2 text-sm pb-2">
        <input type="checkbox" id="filtro-baixo-estoque"> Só estoque baixo
      </label>
      <button id="btn-filtrar" class="btn-primary">Filtrar</button>
    </div>

    <div class="card p-4 md:p-6 overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-gray-500 border-b">
            <th class="py-2 pr-3">Código</th>
            <th class="py-2 pr-3">Produto</th>
            <th class="py-2 pr-3">Localização</th>
            <th class="py-2 pr-3">Saldo</th>
            <th class="py-2 pr-3">Mínimo</th>
            <th class="py-2 pr-3">QR</th>
            <th class="py-2 pr-3"></th>
          </tr>
        </thead>
        <tbody id="tabela-produtos"></tbody>
      </table>
      <p id="msg-vazio-produtos" class="text-sm text-gray-400 py-8 text-center hidden">Nenhum produto encontrado.</p>
    </div>
  </div>
</template>

<!-- Modal de cadastro/edição -->
<div id="modal-produto" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl max-w-lg w-full p-5 md:p-6 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h3 id="modal-titulo" class="font-bold text-lg">Novo Produto</h3>
      <button id="btn-fechar-modal" class="text-gray-400 text-xl leading-none">&times;</button>
    </div>
    <form id="form-produto" class="flex flex-col gap-3">
      <input type="hidden" id="produto-id">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-gray-500 font-medium">Família</label>
          <select required id="produto-familia" class="border rounded-lg px-3 py-2 text-sm w-full bg-white"><option value="">Selecione…</option></select>
        </div>
        <div>
          <label class="text-xs text-gray-500 font-medium">Tipo</label>
          <select required id="produto-tipo" class="border rounded-lg px-3 py-2 text-sm w-full bg-white" disabled><option value="">Selecione a família</option></select>
        </div>
      </div>

      <div id="preview-codigo" class="hidden bg-[var(--graphite-950)] text-white rounded-lg px-3 py-2 text-sm flex items-center justify-between">
        <span>Próximo código:</span>
        <span id="preview-codigo-valor" class="stamp-code text-[var(--amber)]"></span>
      </div>

      <div>
        <label class="text-xs text-gray-500 font-medium">Nome</label>
        <input required id="produto-nome" class="border rounded-lg px-3 py-2 text-sm w-full">
      </div>
      <div>
        <label class="text-xs text-gray-500 font-medium">Descrição</label>
        <textarea id="produto-descricao" rows="2" class="border rounded-lg px-3 py-2 text-sm w-full"></textarea>
      </div>
      <div>
        <label class="text-xs text-gray-500 font-medium">Localização (ex: Estante B, Prateleira 3)</label>
        <input id="produto-localizacao" class="border rounded-lg px-3 py-2 text-sm w-full">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-gray-500 font-medium">Quantidade inicial</label>
          <input required type="number" min="0" id="produto-quantidade" class="border rounded-lg px-3 py-2 text-sm w-full" value="0">
        </div>
        <div>
          <label class="text-xs text-gray-500 font-medium">Estoque mínimo</label>
          <input required type="number" min="0" id="produto-estoque-minimo" class="border rounded-lg px-3 py-2 text-sm w-full" value="0">
        </div>
      </div>
      <button type="submit" class="btn-primary mt-2">Salvar Produto</button>
    </form>
  </div>
</div>

<!-- Modal de QR Code -->
<div id="modal-qr" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl max-w-xs w-full p-6 text-center">
    <p id="qr-codigo-texto" class="stamp-code mb-3"></p>
    <div id="qr-canvas-container" class="flex justify-center mb-4"></div>
    <p id="qr-nome-produto" class="text-sm font-medium mb-4"></p>
    <button id="btn-fechar-qr" class="btn-primary w-full">Fechar</button>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/produtos.js"></script>
</body>
</html>
